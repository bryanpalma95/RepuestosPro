<body>
<header class="header"><a href="index.html" class="logo">Repuestos<span>Pro</span></a><nav class="header-nav" aria-label="Navegación principal"><a href="catalogo.html" class="active" aria-current="page">Catálogo</a><a href="taller.html">Taller</a><div class="appearance-controls"><div class="color-picker"><button type="button" id="catalogPaletteButton" class="palette-button" aria-label="Cambiar color" aria-expanded="false" title="Cambiar color">🎨</button><div id="catalogPalettePopover" class="palette-popover" hidden><input id="catalogPaletteRange" class="palette-range" type="range" min="0" max="7" step="1" value="0" aria-label="Seleccionar paleta de color"></div><select id="catalogPalette" hidden aria-hidden="true" tabindex="-1"><option value="navy">Azul petróleo</option><option value="copper">Grafito y cobre</option><option value="sage">Verde salvia</option><option value="wine">Vino y arena</option><option value="electric">Azul eléctrico</option><option value="teal">Turquesa</option><option value="amber">Ámbar</option><option value="violet">Violeta</option></select></div><button type="button" id="catalogTheme" class="theme-toggle" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">☀</button></div><span class="version">v0.10.0-beta.2</span></nav></header>
<main class="main">
<div class="catalog-workspace"><aside class="catalog-sidebar"><span class="catalog-sidebar-title">Buscar por vehículo</span>
<div class="selectors"><div><label>Marca</label><select id="selMarca" onchange="onMarca()"><option value="">— Seleccionar marca —</option></select></div><div><label>Modelo</label><select id="selModelo" onchange="onModelo()" disabled><option value="">— Seleccionar modelo —</option></select></div><div><label>Año</label><select id="selYear" onchange="onYear()" disabled><option value="">— Seleccionar año —</option></select></div></div></aside><section class="catalog-content"><div class="catalog-heading"><span>CATÁLOGO DE REPUESTOS</span><h1>Encuentra una pieza</h1><p>Busca por vehículo, componente o referencia OEM.</p></div>
<div class="search-wrap"><input type="text" id="searchInput" placeholder="Buscar: Toyota Corolla 2020, filtro aceite, 90915-YZZF2..." oninput="doSearch(this.value)"><div class="search-results" id="searchResults"></div></div>
<div id="homeView"><div class="featured" id="featuredSection"><h3>Los más buscados</h3><div class="featured-grid" id="featuredGrid"></div></div><div style="margin-bottom:1rem;font-size:.8rem;color:#666" id="gridCount"></div><div class="v-grid" id="vehicleGrid"></div><button class="load-more" id="loadMoreBtn" onclick="loadMore()" style="display:none">Cargar más vehículos</button></div>

</section></div>
</main>
<footer class="footer">RepuestosPro v0.10.0-beta.2 — Datos OEM verificados</footer>
<script>
document.querySelector('.logo').href='taller.html';
let NAV={},DATA={},REF_INDEX=new Map(),dataLoaded=false,gridPage=0;const PS=30;
let COMPAT={};
fetch('db-nav.json').then(r=>r.json()).then(d=>{NAV=d;initUI()}).catch(()=>{fetch('db.json').then(r=>r.json()).then(d=>{DATA=d;dataLoaded=true;buildNav();buildReferenceIndex();initUI()})});
fetch('db-compat.json').then(r=>r.json()).then(d=>{COMPAT=d}).catch(()=>{COMPAT={}});
function buildNav(){NAV={};for(const[k,v]of Object.entries(DATA)){const match=String(v.name||'').match(/^(.*?)\s*[—-]\s*(\d{4})$/);const title=match?match[1].trim():String(v.name||'').trim();const y=match?match[2]:'';const w=title.split(/\s+/);const m=w[0]||'';const mo=w.slice(1).join(' ');if(!NAV[m])NAV[m]={};if(!NAV[m][mo])NAV[m][mo]=[];if(y&&!NAV[m][mo].includes(y))NAV[m][mo].push(y)}}
function initUI(){const s=document.getElementById('selMarca');Object.keys(NAV).sort().forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;s.appendChild(o)});populateCompareOptions();renderFeatured();renderGrid()}
function buildReferenceIndex(){REF_INDEX=new Map();for(const[key,vehicle]of Object.entries(DATA)){for(const cat in vehicle.categories){for(const part of vehicle.categories[cat]||[]){for(const ref of part.refs||[]){if(isPlaceholderRef(ref.r))continue;const normalized=normalizeRef(ref.r);if(!normalized)continue;if(!REF_INDEX.has(normalized))REF_INDEX.set(normalized,new Map());REF_INDEX.get(normalized).set(key,vehicle.name)}}}}}
async function ensureDataLoaded(){if(dataLoaded)return;const r=await fetch('db.json');DATA=await r.json();dataLoaded=true;buildNav();buildReferenceIndex();populateCompareOptions();}
function getAllPartsAcrossVehicles(){const set=new Map();for(const [key,vehicle] of Object.entries(DATA)){for(const cat in vehicle.categories){for(const part of vehicle.categories[cat]||[]){const name=(part.name||'').trim();if(name){const clean=name.toLowerCase();if(!set.has(clean))set.set(clean,name)}}}}return [...set.values()].sort((a,b)=>a.localeCompare(b))}
function populateCompareOptions(){const compSel=document.getElementById('compareComponent');const vehicleA=document.getElementById('compareVehicleA');const vehicleB=document.getElementById('compareVehicleB');if(!compSel||!vehicleA||!vehicleB)return;const parts=getAllPartsAcrossVehicles();compSel.innerHTML='<option value="">— Seleccionar pieza —</option>';parts.forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;compSel.appendChild(o)});vehicleA.innerHTML='<option value="">— Vehículo A —</option>';vehicleB.innerHTML='<option value="">— Vehículo B —</option>';for(const [key,vehicle] of Object.entries(DATA||{})){const o1=document.createElement('option');const o2=document.createElement('option');o1.value=key;o1.textContent=vehicle.name;o2.value=key;o2.textContent=vehicle.name;vehicleA.appendChild(o1);vehicleB.appendChild(o2)}}
function normalizeText(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function normalizeRef(value){const ref=String(value||'').trim().toUpperCase().replace(/\s+/g,'');return ref==='W610/3'?'W610/82':ref}
function compatKey(v){return String(v||'').toUpperCase().replace(/\s+/g,'')}
function findVehiclesByRef(refKey){const out=new Map();const nk=normalizeRef(refKey);if(REF_INDEX.has(nk)){for(const[key,name]of REF_INDEX.get(nk)){out.set(key,name)}}return out}
async function showComponent(refKey){await ensureDataLoaded();const ck=compatKey(refKey);const entry=COMPAT[ck];const nk=normalizeRef(refKey);
  document.getElementById('homeView').style.display='none';document.getElementById('detailView').style.display='none';document.getElementById('componentView').style.display='block';
  const nombre=entry?entry.nombre:refKey;const cat=entry?entry.categoria:'Componente';
  let refsList=[refKey];if(entry&&entry.otras_refs&&entry.otras_refs.length)refsList=[entry.ref,...entry.otras_refs];
  let h='<div class="part-cat" style="margin-bottom:.4rem">'+cat+'</div><h2>'+nombre+'</h2><div style="margin-top:.6rem">';
  refsList.forEach(r=>{h+='<span class="cross" style="margin-right:.4rem">'+r+'</span>'});h+='</div>';
  document.getElementById('componentHeader').innerHTML=h;
  const found=new Map();findVehiclesByRef(nk).forEach((n,k)=>found.set(k,n));
  if(entry&&entry.otras_refs){entry.otras_refs.forEach(r=>findVehiclesByRef(r).forEach((n,k)=>found.set(k,n)))}
  let body='';
  if(found.size){
    const groups=new Map();
    [...found.entries()].forEach(([k,n])=>{const mm=String(n).match(/^(.*?)\s*[—-]\s*(\d{4})$/);const base=mm?mm[1].trim():n;const yr=mm?mm[2]:'';if(!groups.has(base))groups.set(base,{key:k,years:[]});if(yr)groups.get(base).years.push(yr)});
    body+='<div style="margin:1.5rem 0 .6rem"><span class="label" style="color:var(--red);letter-spacing:.12em;font-size:.75rem;text-transform:uppercase">En nuestro catalogo ('+groups.size+' modelos, '+found.size+' versiones)</span></div><div class="compat-tags">';
    [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([base,g])=>{const ys=g.years.sort();const rng=ys.length>1?' '+ys[0]+'-'+ys[ys.length-1]:(ys.length?' '+ys[0]:'');body+='<span class="compat-tag" onclick="loadVehicle(\''+g.key+'\')">'+base+rng+'</span>'});
    body+='</div>'}
  if(entry&&entry.compatibles&&entry.compatibles.length){body+='<div style="margin:1.8rem 0 .6rem"><span class="label" style="color:var(--teal);letter-spacing:.12em;font-size:.75rem;text-transform:uppercase">Compatibilidad OEM extendida</span></div><div class="parts-grid" style="margin-top:.6rem">';
    entry.compatibles.forEach(c=>{body+='<div class="part-card">'+(c.marca?'<div class="part-cat">'+c.marca+'</div>':'')+'<div style="font-size:.9rem;line-height:1.4">'+c.modelos+'</div></div>'});
    body+='</div>'}
  if(!found.size&&!(entry&&entry.compatibles&&entry.compatibles.length)){body='<p style="color:var(--muted);margin-top:1.5rem">Sin vehiculos compatibles registrados para esta referencia.</p>'}
  document.getElementById('componentBody').innerHTML=body}
function searchComponents(q){const ql=q.toLowerCase();const res=[];for(const[k,e]of Object.entries(COMPAT)){const hay=(e.ref+' '+e.nombre+' '+e.categoria+' '+(e.otras_refs||[]).join(' ')).toLowerCase();if(hay.includes(ql)){res.push({key:k,label:e.ref+' — '+e.nombre,cat:e.categoria})}}return res}
function findPartInVehicle(vehicle, targetName){const matches=[];for(const cat in vehicle.categories){for(const part of vehicle.categories[cat]||[]){const partName=(part.name||'').trim();const normalizedPart=normalizeText(partName);const normalizedTarget=normalizeText(targetName);if(!normalizedPart||!normalizedTarget)continue;if(normalizedPart===normalizedTarget || normalizedPart.includes(normalizedTarget) || normalizedTarget.includes(normalizedPart)){matches.push(part)}}}return matches}
function getCompatibilityLevel(score){if(score>=2)return 'high';if(score===1)return 'medium';return 'low'}
function runCompare(){const componentName=document.getElementById('compareComponent').value;const vehicleAKey=document.getElementById('compareVehicleA').value;const vehicleBKey=document.getElementById('compareVehicleB').value;const results=document.getElementById('compareResults');if(!componentName||!vehicleAKey||!vehicleBKey){results.innerHTML='<p style="color:#aaa;font-size:.85rem">Selecciona una pieza y dos vehículos para comparar.</p>';return}if(!dataLoaded){ensureDataLoaded().then(runCompare);return}const vehicleA=DATA[vehicleAKey];const vehicleB=DATA[vehicleBKey];const partsA=findPartInVehicle(vehicleA, componentName);const partsB=findPartInVehicle(vehicleB, componentName);const refsA=(partsA.flatMap(p=>((p.refs||[]).filter(r=>!isPlaceholderRef(r.r)).map(r=>normalizeRef(r.r))))||[]).filter(Boolean);const refsB=(partsB.flatMap(p=>((p.refs||[]).filter(r=>!isPlaceholderRef(r.r)).map(r=>normalizeRef(r.r))))||[]).filter(Boolean);const sameRefs=[...new Set(refsA.filter(r=>refsB.includes(r)))];const score=sameRefs.length>0?2:(partsA.length&&partsB.length?1:0);let badgeClass=getCompatibilityLevel(score);let status='No coincide';if(score>=2)status='Compatible';else if(score===1)status='Mismo tipo';const aText=partsA.length?partsA.map(p=>p.name+ (p.refs&&p.refs.length? ' — '+orderedPartRefs(p).map(r=>r.r).join(', '):'')).join('<br>'): 'Sin coincidencia';const bText=partsB.length?partsB.map(p=>p.name+ (p.refs&&p.refs.length? ' — '+orderedPartRefs(p).map(r=>r.r).join(', '):'')).join('<br>'): 'Sin coincidencia';results.innerHTML='<table class="compare-table"><thead><tr><th>Pieza</th><th>'+vehicleA.name+'</th><th>'+vehicleB.name+'</th><th>Estado</th></tr></thead><tbody><tr><td>'+componentName+'</td><td>'+aText+'</td><td>'+bText+'</td><td><span class="compare-badge '+badgeClass+'">'+status+'</span></td></tr></tbody></table>'}
function renderFeatured(){const g=document.getElementById('featuredGrid');['Toyota Corolla','Hyundai Tucson','Mazda CX-5','Honda CR-V','VW Golf','Nissan Kicks','Kia Sportage','Suzuki Swift','Ford Ranger','Chevrolet Onix','Subaru Forester','BMW Serie 3'].forEach(c=>{g.innerHTML+='<div class="feat-chip" onclick="searchFor(\''+c+'\')">'+c+'</div>'})}
function queryMatches(text,query){const canonical=value=>normalizeText(String(value||'').replace(/W610\/(?:3|82)/gi,'W610 equivalente'));const value=canonical(text);return canonical(query).split(' ').filter(Boolean).every(token=>value.includes(token))}
function renderPartResults(query){if(!dataLoaded)return false;const results=[];for(const[key,vehicle]of Object.entries(DATA)){for(const category in vehicle.categories){for(const part of vehicle.categories[category]||[]){const searchable=[part.cat,part.name,part.details, ...(part.refs||[]).map(ref=>ref.r)].join(' ');if(queryMatches(searchable,query))results.push({key,vehicle:vehicle.name,category:part.cat||category,part:part.name,details:part.details||'',refs:orderedPartRefs(part).map(ref=>ref.r).filter(Boolean)})}}}if(!results.length)return false;const grid=document.getElementById('vehicleGrid');const count=document.getElementById('gridCount');document.getElementById('featuredSection').style.display='none';document.getElementById('loadMoreBtn').style.display='none';count.textContent=results.length+' repuestos encontrados para "'+query+'"';grid.innerHTML=results.map(item=>'<div class="v-card part-result" onclick="loadVehicle(\''+item.key+'\')"><span class="part-cat">'+item.category+'</span><h4>'+item.part+'</h4><p>'+item.vehicle+'</p>'+(item.details?'<p>'+item.details+'</p>':'')+(item.refs.length?'<span class="tag">'+item.refs.join(' · ')+'</span>':'')+'<span class="part-result-arrow">Ver vehículo →</span></div>').join('');return true}
function renderGrid(f){if(f&&renderPartResults(f))return;const g=document.getElementById('vehicleGrid');const fs=document.getElementById('featuredSection');const gc=document.getElementById('gridCount');let it=[];for(const[m,ms]of Object.entries(NAV)){for(const[mo,ys]of Object.entries(ms)){if(f&&!(m+' '+mo).toLowerCase().includes(f.toLowerCase()))continue;it.push({m,mo,ys})}}it.sort((a,b)=>a.m.localeCompare(b.m)||a.mo.localeCompare(b.mo));fs.style.display=f?'none':'block';gc.textContent=f?it.length+' resultado'+(it.length!==1?'s':'')+' para "'+f+'"':it.length+' modelos • '+Object.keys(NAV).length+' marcas';const s=gridPage*PS,sl=it.slice(s,s+PS);if(gridPage===0)g.innerHTML='';sl.forEach(i=>{const yr=i.ys.length>1?i.ys[0]+'-'+i.ys[i.ys.length-1]:i.ys[0]||'';g.innerHTML+='<div class="v-card" onclick="selectModel(\''+i.m+'\',\''+i.mo+'\')"><h4>'+i.m+' '+i.mo+'</h4><p>'+yr+'</p><span class="tag">'+i.ys.length+' año'+(i.ys.length>1?'s':'')+'</span></div>'});document.getElementById('loadMoreBtn').style.display=(s+PS<it.length)?'block':'none'}
function loadMore(){gridPage++;renderGrid()}
function onMarca(){const m=document.getElementById('selMarca').value;const s=document.getElementById('selModelo');const y=document.getElementById('selYear');s.innerHTML='<option value="">— Modelo —</option>';y.innerHTML='<option value="">— Año —</option>';s.disabled=!m;y.disabled=true;if(!m){gridPage=0;renderGrid();return}Object.keys(NAV[m]).sort().forEach(mo=>{const o=document.createElement('option');o.value=mo;o.textContent=mo;s.appendChild(o)});gridPage=0;renderGrid(m)}
function onModelo(){const m=document.getElementById('selMarca').value;const mo=document.getElementById('selModelo').value;const s=document.getElementById('selYear');s.innerHTML='<option value="">— Año —</option>';s.disabled=!mo;if(!m||!mo){gridPage=0;renderGrid(m);return}const years=NAV[m][mo]||[];if(years.length>3){const start=years[0];const end=years[years.length-1];const o=document.createElement('option');o.value=years[0];o.textContent=start+'-'+end+' ('+years.length+' años)';s.appendChild(o)}else{years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;s.appendChild(o)})}gridPage=0;renderGrid(m+' '+mo)}
function onYear(){const m=document.getElementById('selMarca').value;const mo=document.getElementById('selModelo').value;const y=document.getElementById('selYear').value;if(!m||!mo||!y)return;loadVehicle(m.toLowerCase()+'-'+mo.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')+'-'+y)}
function selectModel(m,mo){document.getElementById('selMarca').value=m;onMarca();document.getElementById('selModelo').value=mo;onModelo();const ys=NAV[m][mo]||[];if(ys.length){document.getElementById('selYear').value=ys[0];onYear()}}
async function loadVehicle(vid){if(!dataLoaded){document.getElementById('detailHeader').innerHTML='<p style="color:#888">Cargando datos...</p>';document.getElementById('homeView').style.display='none';document.getElementById('detailView').style.display='block';const r=await fetch('db.json');DATA=await r.json();dataLoaded=true;buildReferenceIndex()}let v=DATA[vid];if(!v){for(const[k,d]of Object.entries(DATA)){if(k.includes(vid)||vid.includes(k)){v=d;vid=k;break}}}if(!v){const m=document.getElementById('selMarca').value;const mo=document.getElementById('selModelo').value;const y=document.getElementById('selYear').value;for(const[k,d]of Object.entries(DATA)){if(d.name.toLowerCase().includes(m.toLowerCase())&&d.name.toLowerCase().includes(mo.toLowerCase())&&d.name.includes(y)){v=d;break}}}if(!v){document.getElementById('detailHeader').innerHTML='<p style="color:#e63946">Vehiculo no encontrado</p>';return}showDetail(v)}
function normalizeText(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function normalizeRef(value){const ref=String(value||'').trim().toUpperCase().replace(/\s+/g,'');return ref==='W610/3'?'W610/82':ref}
function isPlaceholderRef(value){const ref=normalizeText(value);return !ref||ref.startsWith('verificar ')||ref.includes(' por modelo')||ref.includes(' por motor')||ref.includes(' segun ')||ref==='segun vin'}
function orderedPartRefs(part){return [...(part.refs||[])].sort((a,b)=>{const score=r=>(isPlaceholderRef(r.r)?20:0)+(r.s==='confirmed'?0:1);return score(a)-score(b)})}
function findCompatibleVehiclesForPart(currentKey, currentVehicle, part){
    const baseRefs = orderedPartRefs(part).filter(r => !isPlaceholderRef(r.r)).map(r => normalizeRef(r.r)).filter(Boolean)
    const matched = new Map()
    if (!baseRefs.length) return []

    for (const ref of baseRefs) {
        for (const [key, vehicleName] of REF_INDEX.get(ref) || []) {
            if (key === currentKey || vehicleName === currentVehicle.name) continue
            if (!matched.has(key)) matched.set(key, {key, vehicleName, reason: []})
            matched.get(key).reason.push(ref)
        }
    }

    return [...matched.values()]
        .map(entry => ({...entry, reason: ['misma referencia: '+[...new Set(entry.reason)].join(', ')]}))
        .sort((a, b) => a.vehicleName.localeCompare(b.vehicleName))
}
function showDetail(v){
    const currentKey = Object.keys(DATA).find(key => DATA[key] === v) || ''
    document.getElementById('homeView').style.display='none';document.getElementById('detailView').style.display='block';
    let h='<h2>'+v.name+'</h2><p>'+v.info+'</p>';
    if(v.crossNote)h+='<div class="cross">'+v.crossNote+'</div>';
    document.getElementById('detailHeader').innerHTML=h;
    let c='';
    for(const cat in v.categories){
        v.categories[cat].forEach(p=>{
            const displayRefs = orderedPartRefs(p)
            const compatible = findCompatibleVehiclesForPart(currentKey, v, p)
            const hasDetails = p.details || p.brands || (p.links && p.links.length) || (p.refs && p.refs.length > 1)
            const hasExpand = compatible.length || hasDetails
            c += '<div class="part-card"><div class="part-cat">'+p.cat+'</div><h4>'+p.name+'</h4>'
            if(displayRefs.length) c += '<span class="part-ref">'+displayRefs[0].r+'</span>'
            if(hasExpand){
                c += '<div class="part-expand" style="display:none;margin-top:.8rem;padding-top:.8rem;border-top:1px solid #333">';
                if(compatible.length){
                    c += '<div class="compat-list"><span class="label">Compatible con ('+compatible.length+')</span><div class="compat-tags">'
                    compatible.forEach(item => {
                        c += '<span class="compat-tag" onclick="event.stopPropagation(); loadVehicle(\''+item.key+'\')">'+item.vehicleName+'</span>'
                    })
                    c += '</div></div>'
                }
                if(p.details)c += '<div class="det"'+(compatible.length?' style="margin-top:.8rem"':'')+'>'+p.details+'</div>';
                if(displayRefs.length>1){c += '<div style="margin-top:.4rem">';displayRefs.slice(1).forEach(r=>{c += '<span class="part-ref" style="opacity:.7">'+r.r+'</span>'});c += '</div>'}
                if(p.brands)c += '<div class="part-brands">Marcas: '+p.brands+'</div>';
                if(p.links && p.links.length){c += '<div style="margin-top:.5rem">';p.links.forEach(l=>{c += '<a href="'+l.u+'" target="_blank" style="color:#93c5fd;font-size:.75rem;margin-right:.8rem">'+l.t+'</a>'});c += '</div>'}
                c += '</div>';
                const btnLabel = compatible.length ? 'Ver compatibilidad ▼' : 'Ver mas ▼';
                const btnHide = 'Ocultar ▲';
                c += '<div class="expand-toggle" style="margin-top:.5rem;font-size:.72rem;color:var(--teal);cursor:pointer;font-weight:600" onclick="event.stopPropagation();const x=this.previousElementSibling;const open=x.style.display===\'none\';x.style.display=open?\'block\':\'none\';this.textContent=open?\''+btnHide+'\':\''+btnLabel+'\'">'+btnLabel+'</div>'
            }
            c += '</div>'
        })
    }
    document.getElementById('partsGrid').innerHTML=c
}
