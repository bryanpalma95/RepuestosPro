<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e63946">
    <title>RepuestosPro — Catálogo de Repuestos</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#121212;color:#e0e0e0;line-height:1.5}
a{text-decoration:none;color:inherit}
.header{background:#1a1a1a;border-bottom:1px solid #333;padding:.8rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1.4rem;font-weight:800;cursor:pointer}.logo span{color:#e63946}
.version{font-size:.75rem;color:#666}
.main{max-width:1200px;margin:0 auto;padding:1.5rem}
.search-wrap{margin-bottom:1.5rem;position:relative}
.search-wrap input{width:100%;padding:.9rem 1.2rem;background:#1e1e1e;border:2px solid #333;border-radius:8px;color:#fff;font-size:1rem;outline:none}
.search-wrap input:focus{border-color:#e63946}
.search-wrap input::placeholder{color:#666}
.search-results{position:absolute;top:100%;left:0;right:0;background:#1e1e1e;border:1px solid #333;border-radius:0 0 8px 8px;max-height:320px;overflow-y:auto;z-index:100;display:none}
.search-results .sr-item{padding:.7rem 1rem;cursor:pointer;border-bottom:1px solid #2a2a2a;font-size:.9rem}
.search-results .sr-item:hover{background:#2a2a2a;color:#e63946}
.sr-marca{color:#e63946;font-weight:700;font-size:.7rem;text-transform:uppercase}
.selectors{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem;margin-bottom:1.5rem}
@media(max-width:700px){.selectors{grid-template-columns:1fr}}
.selectors select{padding:.7rem;background:#1e1e1e;border:1px solid #333;border-radius:6px;color:#e0e0e0;font-size:.9rem;width:100%}
.selectors label{display:block;font-size:.7rem;color:#888;text-transform:uppercase;margin-bottom:.3rem;font-weight:600}
.compare-panel{background:#1b1b1b;border:1px solid #2a2a2a;border-radius:10px;padding:1rem;margin-bottom:1.2rem}
.compare-header{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:.8rem}
.compare-header h3{font-size:.8rem;text-transform:uppercase;color:#aaa;letter-spacing:1px}
.compare-btn{background:#e63946;border:none;color:white;padding:.7rem 1rem;border-radius:6px;font-weight:700;cursor:pointer}
.compare-controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:.8rem}
@media(max-width:700px){.compare-controls{grid-template-columns:1fr}}
.compare-controls select{padding:.7rem;background:#1e1e1e;border:1px solid #333;border-radius:6px;color:#e0e0e0;font-size:.9rem;width:100%}
.compare-results{margin-top:1rem;overflow-x:auto}
.compare-table{width:100%;border-collapse:collapse;border:1px solid #2a2a2a;background:#171717}
.compare-table th,.compare-table td{padding:.75rem .7rem;border-bottom:1px solid #2a2a2a;text-align:left;vertical-align:top;font-size:.8rem}
.compare-table th{color:#aaa;background:#1d1d1d}
.compare-badge{display:inline-block;padding:.2rem .5rem;border-radius:999px;font-size:.7rem;font-weight:700}
.compare-badge.high{background:#163b2b;color:#8af0c3}
.compare-badge.medium{background:#3b2d16;color:#ffd38a}
.compare-badge.low{background:#3a222a;color:#f7a8b1}
.featured{margin-bottom:2rem}
.featured h3{font-size:.85rem;color:#888;text-transform:uppercase;margin-bottom:.8rem;letter-spacing:1px}
.featured-grid{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.5rem}
.feat-chip{background:#1e1e1e;border:1px solid #333;border-radius:20px;padding:.5rem 1rem;font-size:.82rem;white-space:nowrap;cursor:pointer;transition:all .2s}
.feat-chip:hover{border-color:#e63946;color:#e63946}
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:1.5rem}
.v-card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:8px;padding:1rem;cursor:pointer;transition:all .2s}
.v-card:hover{border-color:#e63946;transform:translateY(-2px);box-shadow:0 4px 12px rgba(230,57,70,.15)}
.v-card h4{font-size:.9rem;margin-bottom:.3rem}
.v-card p{font-size:.78rem;color:#888}
.v-card .tag{display:inline-block;background:#2a2a2a;padding:.15rem .5rem;border-radius:3px;font-size:.7rem;color:#aaa;margin-top:.4rem}
.detail{display:none}
.detail-header{margin-bottom:1.5rem}
.detail-header h2{font-size:1.3rem;margin-bottom:.3rem}
.detail-header p{color:#888;font-size:.85rem}
.detail-header .cross{background:#1a2e1a;border:1px solid #2d5a2d;border-radius:6px;padding:.6rem 1rem;margin-top:.8rem;font-size:.8rem;color:#6ee76e}
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.part-card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:8px;padding:1rem}
.part-card:hover{border-color:#e63946}
.part-cat{font-size:.65rem;text-transform:uppercase;color:#e63946;font-weight:700;margin-bottom:.3rem}
.part-card h4{font-size:.88rem;margin-bottom:.4rem}
.part-card .det{font-size:.78rem;color:#999;margin-bottom:.4rem}
.part-ref{display:inline-block;background:#0a2a0a;border:1px solid #2d5a2d;color:#6ee76e;padding:.15rem .5rem;border-radius:4px;font-size:.75rem;font-weight:600;margin:.2rem .3rem .2rem 0}
.part-brands{font-size:.75rem;color:#777;margin-top:.5rem}
.compat-list{margin-top:.8rem;padding-top:.7rem;border-top:1px solid #333}
.compat-list .label{display:block;font-size:.68rem;text-transform:uppercase;color:#aaa;letter-spacing:.08em;margin-bottom:.4rem}
.compat-tags{display:flex;flex-wrap:wrap;gap:.4rem}
.compat-tag{display:inline-block;background:#1f2b36;border:1px solid #35556d;color:#b9dfff;padding:.25rem .5rem;border-radius:999px;font-size:.72rem;cursor:pointer;transition:all .2s}
.compat-tag:hover{border-color:#7db4ff;background:#233a4d}
.back-btn{display:inline-block;padding:.5rem 1rem;background:#2a2a2a;border-radius:6px;font-size:.85rem;cursor:pointer;margin-bottom:1rem;transition:background .2s}
.back-btn:hover{background:#333}
.load-more{display:block;width:100%;padding:.8rem;background:#2a2a2a;border:none;border-radius:6px;color:#e0e0e0;font-size:.9rem;cursor:pointer;margin-top:1rem}
.load-more:hover{background:#333}
.footer{text-align:center;padding:2rem;color:#555;font-size:.8rem;border-top:1px solid #2a2a2a;margin-top:2rem}
</style>
<style>
:root{--paper:#f4f1ea;--surface:#fffdf8;--ink:#17211f;--muted:#69736e;--line:#d9ded8;--red:#df4d32;--teal:#087f79;--yellow:#f0c84b;--shadow:0 18px 45px rgba(23,33,31,.09)}
body{font-family:"Trebuchet MS","Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(#b7beb7 .7px,transparent .7px);background-size:16px 16px;z-index:-1}
.header{height:76px;background:var(--ink);border:0;padding:0 max(1.5rem,calc((100vw - 1240px)/2));box-shadow:0 4px 0 var(--red)}
.logo{font-family:Georgia,serif;font-size:1.65rem;color:var(--surface)}.logo span{color:var(--yellow)}.version{color:#aab7b0;letter-spacing:.12em;text-transform:uppercase}
.main{max-width:1240px;padding:3.7rem 1.5rem 4rem}.main:before{content:"CATALOGO DE REPUESTOS";display:block;color:var(--red);font-size:.7rem;font-weight:800;letter-spacing:.2em;margin-bottom:.75rem}.main:after{content:"Datos locales verificados · búsqueda por vehículo, pieza o referencia OEM";display:block;position:absolute;top:139px;color:var(--muted);font-size:.9rem}
.search-wrap{max-width:900px;margin-bottom:1.8rem}.search-wrap:before{content:"Encuentra una pieza";display:block;font-family:Georgia,serif;font-size:clamp(2rem,4vw,3.7rem);font-weight:700;letter-spacing:-.05em;line-height:1;margin-bottom:1.25rem}.search-wrap input{height:64px;padding:0 1.35rem 0 3.2rem;background:var(--surface);border:2px solid var(--ink);border-radius:4px;color:var(--ink);font-size:1rem;box-shadow:6px 6px 0 var(--yellow)}.search-wrap input:focus{border-color:var(--red);box-shadow:6px 6px 0 var(--red)}.search-wrap input::placeholder{color:#8a928c}
.search-results{background:var(--surface);border:2px solid var(--ink);border-top:0;color:var(--ink);box-shadow:var(--shadow)}.search-results .sr-item{padding:.85rem 1rem;border-bottom:1px solid var(--line)}.search-results .sr-item:hover{background:#e8f2ee;color:var(--teal)}.sr-marca{color:var(--red)}
.selectors{grid-template-columns:repeat(3,1fr);gap:0;margin:3.1rem 0 2.5rem;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px;overflow:hidden;max-width:1000px}.selectors>div{padding:1rem 1.15rem;border-right:1px solid var(--line)}.selectors>div:last-child{border-right:0}.selectors label{color:var(--teal);letter-spacing:.14em;margin-bottom:.55rem}.selectors select,.compare-controls select{padding:.75rem .65rem;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;color:var(--ink)}
.compare-panel{max-width:1000px;background:var(--ink);border:0;border-radius:4px;padding:1.4rem 1.5rem;margin-bottom:3rem;box-shadow:var(--shadow);color:var(--surface)}.compare-panel:after{content:"↗";position:absolute;right:1.3rem;bottom:-1rem;color:var(--teal);font:8rem Georgia;opacity:.5}.compare-header h3{color:var(--yellow);letter-spacing:.16em}.compare-btn{background:var(--red);border-radius:3px}.compare-controls select{color:var(--surface);border-color:#53615b}.compare-controls option{color:var(--ink)}
.featured h3{font-family:Georgia,serif;text-transform:none;letter-spacing:-.02em;font-size:1.45rem;color:var(--ink)}.featured h3:after{content:" / accesos rápidos";font:italic 1rem Georgia;color:var(--muted)}.feat-chip{background:transparent;border:1px solid var(--ink);border-radius:2px;color:var(--ink)}.feat-chip:hover{background:var(--yellow);border-color:var(--ink);color:var(--ink)}
#gridCount{color:var(--muted)!important;letter-spacing:.08em;text-transform:uppercase}.v-grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);box-shadow:var(--shadow)}.v-card{min-height:148px;background:var(--surface);border:0;border-radius:0;padding:1.25rem;position:relative}.v-card:hover{background:#e8f2ee;border:0;box-shadow:none;transform:none}.v-card:after{content:"→";position:absolute;right:1.2rem;bottom:1rem;color:var(--red);font-size:1.25rem}.v-card h4{font-family:Georgia,serif;font-size:1.05rem;max-width:85%}.v-card p{color:var(--muted);margin-top:.65rem}.v-card .tag{background:#e7eee9;border-radius:2px;color:var(--teal)}.load-more{background:var(--ink);border-radius:3px;color:var(--surface);max-width:260px;margin:1.5rem auto 0}.load-more:hover{background:var(--teal)}
.detail{animation:rise .35s ease both}.back-btn{background:var(--ink);border-radius:3px;color:var(--surface)}.detail-header{background:var(--surface);border-left:6px solid var(--red);padding:1.5rem;box-shadow:var(--shadow)}.detail-header h2{font-family:Georgia,serif;font-size:2rem}.detail-header .cross{background:#e8f2ee;border-color:#9bc8b8;color:var(--teal);border-radius:2px}.parts-grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:1.5rem}.part-card{background:var(--surface);border:0;border-radius:0}.part-card:hover{border:0;background:#fff}.part-cat{color:var(--red);letter-spacing:.12em}.part-card h4{font-family:Georgia,serif}.part-ref{background:#e8f2ee;border-color:#add2c4;color:var(--teal);border-radius:2px}.compat-list{border-color:var(--line)}.compat-tag{background:#edf1ee;border-color:#b7c6be;color:var(--ink);border-radius:2px}.compat-tag:hover{background:var(--yellow);border-color:var(--ink);color:var(--ink)}.footer{background:var(--ink);border:0;color:#aab7b0;margin-top:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:700px){.main{padding:2.4rem 1rem 3rem}.main:after{position:static;margin:-.1rem 0 2rem;font-size:.8rem}.search-wrap:before{font-size:2.35rem}.search-wrap input{height:58px}.selectors{grid-template-columns:1fr;margin-top:2rem}.selectors>div{border-right:0;border-bottom:1px solid var(--line)}.selectors>div:last-child{border-bottom:0}.compare-panel{padding:1rem}.compare-header{align-items:flex-start;flex-direction:column}.compare-controls{grid-template-columns:1fr}.v-grid,.parts-grid{grid-template-columns:1fr}.detail-header h2{font-size:1.55rem}}
</style>
</head>
<body>
<header class="header"><a href="index.html" class="logo">Repuestos<span>Pro</span></a><span class="version">v0.9.1</span></header>
<main class="main">
<div class="search-wrap"><input type="text" id="searchInput" placeholder="Buscar: Toyota Corolla 2020, filtro aceite, 90915-YZZF2..." oninput="doSearch(this.value)"><div class="search-results" id="searchResults"></div></div>
<div class="selectors"><div><label>Marca</label><select id="selMarca" onchange="onMarca()"><option value="">— Seleccionar marca —</option></select></div><div><label>Modelo</label><select id="selModelo" onchange="onModelo()" disabled><option value="">— Seleccionar modelo —</option></select></div><div><label>Año</label><select id="selYear" onchange="onYear()" disabled><option value="">— Seleccionar año —</option></select></div></div>
<div id="homeView"><div class="featured" id="featuredSection"><h3>Los más buscados</h3><div class="featured-grid" id="featuredGrid"></div></div><div style="margin-bottom:1rem;font-size:.8rem;color:#666" id="gridCount"></div><div class="v-grid" id="vehicleGrid"></div><button class="load-more" id="loadMoreBtn" onclick="loadMore()" style="display:none">Cargar más vehículos</button></div>
<div class="detail" id="detailView"><div class="back-btn" onclick="goHome()">← Volver</div><div class="detail-header" id="detailHeader"></div><div class="parts-grid" id="partsGrid"></div></div>
</main>
<footer class="footer">RepuestosPro v0.9.1 — Datos OEM verificados</footer>
<script>
let NAV={},DATA={},dataLoaded=false,gridPage=0;const PS=30;
fetch('db-nav.json').then(r=>r.json()).then(d=>{NAV=d;initUI()}).catch(()=>{fetch('db.json').then(r=>r.json()).then(d=>{DATA=d;dataLoaded=true;buildNav();initUI()})});
function buildNav(){NAV={};for(const[k,v]of Object.entries(DATA)){const match=String(v.name||'').match(/^(.*?)\s*[—-]\s*(\d{4})$/);const title=match?match[1].trim():String(v.name||'').trim();const y=match?match[2]:'';const w=title.split(/\s+/);const m=w[0]||'';const mo=w.slice(1).join(' ');if(!NAV[m])NAV[m]={};if(!NAV[m][mo])NAV[m][mo]=[];if(y&&!NAV[m][mo].includes(y))NAV[m][mo].push(y)}}
function initUI(){const s=document.getElementById('selMarca');Object.keys(NAV).sort().forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;s.appendChild(o)});populateCompareOptions();renderFeatured();renderGrid()}
async function ensureDataLoaded(){if(dataLoaded)return;const r=await fetch('db.json');DATA=await r.json();dataLoaded=true;buildNav();populateCompareOptions();}
function getAllPartsAcrossVehicles(){const set=new Map();for(const [key,vehicle] of Object.entries(DATA)){for(const cat in vehicle.categories){for(const part of vehicle.categories[cat]||[]){const name=(part.name||'').trim();if(name){const clean=name.toLowerCase();if(!set.has(clean))set.set(clean,name)}}}}return [...set.values()].sort((a,b)=>a.localeCompare(b))}
function populateCompareOptions(){const compSel=document.getElementById('compareComponent');const vehicleA=document.getElementById('compareVehicleA');const vehicleB=document.getElementById('compareVehicleB');if(!compSel||!vehicleA||!vehicleB)return;const parts=getAllPartsAcrossVehicles();compSel.innerHTML='<option value="">— Seleccionar pieza —</option>';parts.forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;compSel.appendChild(o)});vehicleA.innerHTML='<option value="">— Vehículo A —</option>';vehicleB.innerHTML='<option value="">— Vehículo B —</option>';for(const [key,vehicle] of Object.entries(DATA||{})){const o1=document.createElement('option');const o2=document.createElement('option');o1.value=key;o1.textContent=vehicle.name;o2.value=key;o2.textContent=vehicle.name;vehicleA.appendChild(o1);vehicleB.appendChild(o2)}}
function normalizeText(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function normalizeRef(value){return String(value||'').trim().toUpperCase().replace(/\s+/g,'')}
function findPartInVehicle(vehicle, targetName){const matches=[];for(const cat in vehicle.categories){for(const part of vehicle.categories[cat]||[]){const partName=(part.name||'').trim();const normalizedPart=normalizeText(partName);const normalizedTarget=normalizeText(targetName);if(!normalizedPart||!normalizedTarget)continue;if(normalizedPart===normalizedTarget || normalizedPart.includes(normalizedTarget) || normalizedTarget.includes(normalizedPart)){matches.push(part)}}}return matches}
function getCompatibilityLevel(score){if(score>=2)return 'high';if(score===1)return 'medium';return 'low'}
function runCompare(){const componentName=document.getElementById('compareComponent').value;const vehicleAKey=document.getElementById('compareVehicleA').value;const vehicleBKey=document.getElementById('compareVehicleB').value;const results=document.getElementById('compareResults');if(!componentName||!vehicleAKey||!vehicleBKey){results.innerHTML='<p style="color:#aaa;font-size:.85rem">Selecciona una pieza y dos vehículos para comparar.</p>';return}if(!dataLoaded){ensureDataLoaded().then(runCompare);return}const vehicleA=DATA[vehicleAKey];const vehicleB=DATA[vehicleBKey];const partsA=findPartInVehicle(vehicleA, componentName);const partsB=findPartInVehicle(vehicleB, componentName);const refsA=(partsA.flatMap(p=>((p.refs||[]).map(r=>normalizeRef(r.r))))||[]).filter(Boolean);const refsB=(partsB.flatMap(p=>((p.refs||[]).map(r=>normalizeRef(r.r))))||[]).filter(Boolean);const sameRefs=[...new Set(refsA.filter(r=>refsB.includes(r)))];const score=sameRefs.length>0?2:(partsA.length&&partsB.length?1:0);let badgeClass=getCompatibilityLevel(score);let status='No coincide';if(score>=2)status='Compatible';else if(score===1)status='Mismo tipo';const aText=partsA.length?partsA.map(p=>p.name+ (p.refs&&p.refs.length? ' — '+p.refs.map(r=>r.r).join(', '):'')).join('<br>'): 'Sin coincidencia';const bText=partsB.length?partsB.map(p=>p.name+ (p.refs&&p.refs.length? ' — '+p.refs.map(r=>r.r).join(', '):'')).join('<br>'): 'Sin coincidencia';results.innerHTML='<table class="compare-table"><thead><tr><th>Pieza</th><th>'+vehicleA.name+'</th><th>'+vehicleB.name+'</th><th>Estado</th></tr></thead><tbody><tr><td>'+componentName+'</td><td>'+aText+'</td><td>'+bText+'</td><td><span class="compare-badge '+badgeClass+'">'+status+'</span></td></tr></tbody></table>'}
function renderFeatured(){const g=document.getElementById('featuredGrid');['Toyota Corolla','Hyundai Tucson','Mazda CX-5','Honda CR-V','VW Golf','Nissan Kicks','Kia Sportage','Suzuki Swift','Ford Ranger','Chevrolet Onix','Subaru Forester','BMW Serie 3'].forEach(c=>{g.innerHTML+='<div class="feat-chip" onclick="searchFor(\''+c+'\')">'+c+'</div>'})}
function queryMatches(text,query){const value=normalizeText(text);return normalizeText(query).split(' ').filter(Boolean).every(token=>value.includes(token))}
function renderPartResults(query){if(!dataLoaded)return false;const results=[];for(const[key,vehicle]of Object.entries(DATA)){for(const category in vehicle.categories){for(const part of vehicle.categories[category]||[]){const searchable=[part.cat,part.name,part.details, ...(part.refs||[]).map(ref=>ref.r)].join(' ');if(queryMatches(searchable,query))results.push({key,vehicle:vehicle.name,category:part.cat||category,part:part.name,details:part.details||'',refs:(part.refs||[]).map(ref=>ref.r).filter(Boolean)})}}}if(!results.length)return false;const grid=document.getElementById('vehicleGrid');const count=document.getElementById('gridCount');document.getElementById('featuredSection').style.display='none';document.getElementById('loadMoreBtn').style.display='none';count.textContent=results.length+' repuestos encontrados para "'+query+'"';grid.innerHTML=results.map(item=>'<div class="v-card part-result" onclick="loadVehicle(\''+item.key+'\')"><span class="part-cat">'+item.category+'</span><h4>'+item.part+'</h4><p>'+item.vehicle+'</p>'+(item.details?'<p>'+item.details+'</p>':'')+(item.refs.length?'<span class="tag">'+item.refs.join(' · ')+'</span>':'')+'<span class="part-result-arrow">Ver vehículo →</span></div>').join('');return true}
function renderGrid(f){if(f&&renderPartResults(f))return;const g=document.getElementById('vehicleGrid');const fs=document.getElementById('featuredSection');const gc=document.getElementById('gridCount');let it=[];for(const[m,ms]of Object.entries(NAV)){for(const[mo,ys]of Object.entries(ms)){if(f&&!(m+' '+mo).toLowerCase().includes(f.toLowerCase()))continue;it.push({m,mo,ys})}}it.sort((a,b)=>a.m.localeCompare(b.m)||a.mo.localeCompare(b.mo));fs.style.display=f?'none':'block';gc.textContent=f?it.length+' resultado'+(it.length!==1?'s':'')+' para "'+f+'"':it.length+' modelos • '+Object.keys(NAV).length+' marcas';const s=gridPage*PS,sl=it.slice(s,s+PS);if(gridPage===0)g.innerHTML='';sl.forEach(i=>{const yr=i.ys.length>1?i.ys[0]+'-'+i.ys[i.ys.length-1]:i.ys[0]||'';g.innerHTML+='<div class="v-card" onclick="selectModel(\''+i.m+'\',\''+i.mo+'\')"><h4>'+i.m+' '+i.mo+'</h4><p>'+yr+'</p><span class="tag">'+i.ys.length+' año'+(i.ys.length>1?'s':'')+'</span></div>'});document.getElementById('loadMoreBtn').style.display=(s+PS<it.length)?'block':'none'}
function loadMore(){gridPage++;renderGrid()}
function onMarca(){const m=document.getElementById('selMarca').value;const s=document.getElementById('selModelo');const y=document.getElementById('selYear');s.innerHTML='<option value="">— Modelo —</option>';y.innerHTML='<option value="">— Año —</option>';s.disabled=!m;y.disabled=true;if(!m){gridPage=0;renderGrid();return}Object.keys(NAV[m]).sort().forEach(mo=>{const o=document.createElement('option');o.value=mo;o.textContent=mo;s.appendChild(o)});gridPage=0;renderGrid(m)}
function onModelo(){const m=document.getElementById('selMarca').value;const mo=document.getElementById('selModelo').value;const s=document.getElementById('selYear');s.innerHTML='<option value="">— Año —</option>';s.disabled=!mo;if(!m||!mo){gridPage=0;renderGrid(m);return}const years=NAV[m][mo]||[];if(years.length>3){const start=years[0];const end=years[years.length-1];const o=document.createElement('option');o.value=years[0];o.textContent=start+'-'+end+' ('+years.length+' años)';s.appendChild(o)}else{years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;s.appendChild(o)})}gridPage=0;renderGrid(m+' '+mo)}
function onYear(){const m=document.getElementById('selMarca').value;const mo=document.getElementById('selModelo').value;const y=document.getElementById('selYear').value;if(!m||!mo||!y)return;loadVehicle(m.toLowerCase()+'-'+mo.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')+'-'+y)}
function selectModel(m,mo){document.getElementById('selMarca').value=m;onMarca();document.getElementById('selModelo').value=mo;onModelo();const ys=NAV[m][mo]||[];if(ys.length){document.getElementById('selYear').value=ys[0];onYear()}}
async function loadVehicle(vid){if(!dataLoaded){document.getElementById('detailHeader').innerHTML='<p style="color:#888">Cargando datos...</p>';document.getElementById('homeView').style.display='none';document.getElementById('detailView').style.display='block';const r=await fetch('db.json');DATA=await r.json();dataLoaded=true}let v=DATA[vid];if(!v){for(const[k,d]of Object.entries(DATA)){if(k.includes(vid)||vid.includes(k)){v=d;vid=k;break}}}if(!v){const m=document.getElementById('selMarca').value;const mo=document.getElementById('selModelo').value;const y=document.getElementById('selYear').value;for(const[k,d]of Object.entries(DATA)){if(d.name.toLowerCase().includes(m.toLowerCase())&&d.name.toLowerCase().includes(mo.toLowerCase())&&d.name.includes(y)){v=d;break}}}if(!v){document.getElementById('detailHeader').innerHTML='<p style="color:#e63946">Vehiculo no encontrado</p>';return}showDetail(v)}
function normalizeText(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function normalizeRef(value){return String(value||'').trim().toUpperCase().replace(/\s+/g,'')}
function findCompatibleVehiclesForPart(currentKey, currentVehicle, part){
    const baseRefs = (part.refs || []).map(r => normalizeRef(r.r)).filter(Boolean)
    const matched = new Map()
    if (!baseRefs.length) return []

    for (const [key, vehicle] of Object.entries(DATA)) {
        if (key === currentKey || vehicle.name === currentVehicle.name) continue
        for (const cat in vehicle.categories) {
            const items = vehicle.categories[cat] || []
            for (const item of items) {
                let score = 0
                const itemRefs = (item.refs || []).map(r => normalizeRef(r.r)).filter(Boolean)
                if (baseRefs.length && itemRefs.length) {
                    for (const ref of baseRefs) {
                        if (itemRefs.includes(ref)) score += 10
                    }
                }
                if (score > 0) {
                    if (!matched.has(key)) matched.set(key, {key, vehicleName: vehicle.name, reason: []})
                    const entry = matched.get(key)
                    entry.reason.push('misma referencia')
                }
            }
        }
    }

    return [...matched.values()]
        .map(entry => ({...entry, reason: [...new Set(entry.reason)].slice(0, 2)}))
        .sort((a, b) => a.vehicleName.localeCompare(b.vehicleName))
}
function showDetail(v){
    const currentKey = Object.keys(DATA).find(key => DATA[key] === v) || ''
    document.getElementById('homeView').style.display='none';document.getElementById('detailView').style.display='block';
    let h='<h2>'+v.name+'</h2><p>'+v.info+'</p>';
    if(v.crossNote)h+='<div class="cross">'+v.crossNote+'</div>';
    document.getElementById('detailHeader').innerHTML=h;
    let c='';
    for(const cat in v.categories){
        v.categories[cat].forEach(p=>{
            const compatible = findCompatibleVehiclesForPart(currentKey, v, p)
            const hasMore = p.details || p.brands || (p.links && p.links.length) || (p.refs && p.refs.length > 1)
            c += '<div class="part-card"><div class="part-cat">'+p.cat+'</div><h4>'+p.name+'</h4>'
            if(p.refs && p.refs.length) c += '<span class="part-ref">'+p.refs[0].r+'</span>'
            if(compatible.length){
                c += '<div class="compat-list"><span class="label">Compatible con</span><div class="compat-tags">'
                compatible.forEach(item => {
                    c += '<span class="compat-tag" onclick="event.stopPropagation(); loadVehicle(\''+item.key+'\')">'+item.vehicleName+'</span>'
                })
                c += '</div></div>'
            }
            if(hasMore){
                c += '<div class="part-expand" style="display:none;margin-top:.8rem;padding-top:.8rem;border-top:1px solid #333">';
                if(p.details)c += '<div class="det">'+p.details+'</div>';
                if(p.refs && p.refs.length>1){c += '<div style="margin-top:.4rem">';p.refs.slice(1).forEach(r=>{c += '<span class="part-ref" style="opacity:.7">'+r.r+'</span>'});c += '</div>'}
                if(p.brands)c += '<div class="part-brands">Marcas: '+p.brands+'</div>';
                if(p.links && p.links.length){c += '<div style="margin-top:.5rem">';p.links.forEach(l=>{c += '<a href="'+l.u+'" target="_blank" style="color:#93c5fd;font-size:.75rem;margin-right:.8rem">'+l.t+'</a>'});c += '</div>'}
                c += '</div><div style="text-align:right;margin-top:.5rem;font-size:.7rem;color:#666;cursor:pointer" onclick="event.stopPropagation();const x=this.previousElementSibling;x.style.display=x.style.display===\'none\'?\'block\':\'none\';this.textContent=x.style.display===\'none\'?\'Ver mas ▼\':\'Ocultar ▲\'">Ver mas ▼</div>'
            }
            c += '</div>'
        })
    }
    document.getElementById('partsGrid').innerHTML=c
}
function goHome(){document.getElementById('homeView').style.display='block';document.getElementById('detailView').style.display='none';document.getElementById('selYear').value=''}
let st;function doSearch(q){clearTimeout(st);const b=document.getElementById('searchResults');if(q.length<2){b.style.display='none';gridPage=0;renderGrid();return}if(!dataLoaded){ensureDataLoaded().then(()=>doSearch(q));return}st=setTimeout(()=>{gridPage=0;renderGrid(q);const r=[];const ql=q.toLowerCase();for(const[m,ms]of Object.entries(NAV)){for(const mo of Object.keys(ms)){if((m+' '+mo).toLowerCase().includes(ql)){r.push({t:'m',x:m+' '+mo,m,mo});if(r.length>=10)break}}if(r.length>=10)break}if(r.length<10){for(const[k,v]of Object.entries(DATA)){for(const cat in v.categories){for(const p of v.categories[cat]){const partText=(p.name+' '+(p.details||'')).toLowerCase();for(const ref of p.refs||[]){if(ref.r.toLowerCase().includes(ql)||partText.includes(ql)){r.push({t:'r',x:ref.r+' — '+p.name,k});if(r.length>=10)break}}if(r.length>=10)break}if(r.length>=10)break}if(r.length>=10)break}}if(!r.length){b.style.display='none';return}b.innerHTML=r.map(i=>i.t==='m'?'<div class="sr-item" onclick="selectModel(\''+i.m+'\',\''+i.mo+'\')"><span class="sr-marca">'+i.m+'</span> '+i.mo+'</div>':'<div class="sr-item" onclick="loadVehicle(\''+i.k+'\')"><span class="sr-marca">REF</span> '+i.x+'</div>').join('');b.style.display='block'},200)}
function searchFor(q){document.getElementById('searchInput').value=q;doSearch(q)}
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))document.getElementById('searchResults').style.display='none'});
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>{r.forEach(s=>s.unregister())})}
</script>
